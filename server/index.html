<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>LED Server</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Crect x='9' y='18' width='46' height='26' rx='5' fill='%23ef4444'/%3E%3Crect x='13' y='22' width='38' height='18' rx='3' fill='%23000'/%3E%3Cpath d='M18 28h4v8h-4zm8 0h4v8h-4zm8 0h4v8h-4zm8 0h4v8h-4z' fill='%23ff3333'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef0f6;
      --surface: #ffffff;
      --surface-2: #f5f6fa;
      --surface-3: #eaecf3;
      --text-1: #111827;
      --text-2: #4b5563;
      --text-3: #9ca3af;
      --border: #e5e7eb;
      --border-2: #d1d5db;
      --accent: #e11d48;
      --green: #059669;
      --green-soft: #ecfdf5;
      --green-text: #065f46;
      --red: #dc2626;
      --red-soft: #fef2f2;
      --red-text: #991b1b;
      --blue-soft: #eff6ff;
      --blue-text: #1e40af;
      --amber-soft: #fffbeb;
      --amber-text: #92400e;
      --teal-soft: #f0fdfa;
      --teal-text: #134e4a;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --nav-h: 56px;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #080c14; --surface: #0f1623; --surface-2: #141d2d; --surface-3: #1a2438;
        --text-1: #e2e8f0; --text-2: #94a3b8; --text-3: #475569;
        --border: #1e293b; --border-2: #334155;
        --green-soft: #022c1e; --green-text: #6ee7b7;
        --red-soft: #2a0808; --red-text: #fca5a5;
        --blue-soft: #0c1e45; --blue-text: #93c5fd;
        --amber-soft: #271900; --amber-text: #fcd34d;
        --teal-soft: #021a18; --teal-text: #5eead4;
      }
    }
    :root[data-theme="dark"] {
      --bg: #080c14; --surface: #0f1623; --surface-2: #141d2d; --surface-3: #1a2438;
      --text-1: #e2e8f0; --text-2: #94a3b8; --text-3: #475569;
      --border: #1e293b; --border-2: #334155;
      --green-soft: #022c1e; --green-text: #6ee7b7;
      --red-soft: #2a0808; --red-text: #fca5a5;
      --blue-soft: #0c1e45; --blue-text: #93c5fd;
      --amber-soft: #271900; --amber-text: #fcd34d;
      --teal-soft: #021a18; --teal-text: #5eead4;
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-1);
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    /* ─── Navbar ─── */
    .nav {
      position: sticky; top: 0; z-index: 100;
      height: var(--nav-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 20px; gap: 12px;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 9px;
      flex: 0 0 auto;
    }
    .nav-brand-icon {
      width: 30px; height: 30px;
      background: var(--accent);
      border-radius: 7px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .nav-brand-icon svg { width: 16px; height: 16px; stroke: white; }
    .nav-brand-name { font-size: 15px; font-weight: 600; color: var(--text-1); letter-spacing: -.3px; }
    .nav-spacer { flex: 1; }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .ws-chip {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 11px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface-2);
      font-size: 12px; color: var(--text-3); white-space: nowrap;
    }
    .ws-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-3); flex-shrink: 0;
      transition: background .3s;
    }
    .ws-dot.on  { background: var(--green); }
    .ws-dot.off { background: var(--red); }
    .icon-btn {
      width: 34px; height: 34px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text-2);
      display: grid; place-items: center; cursor: pointer;
      transition: background .15s;
    }
    .icon-btn:hover { background: var(--surface-3); color: var(--text-1); }
    .icon-btn svg { width: 15px; height: 15px; }
    .nav-action {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 12px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text-2);
      font-family: var(--font); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }
    .nav-action:hover { background: var(--surface-3); color: var(--text-1); }
    .nav-action svg { width: 14px; height: 14px; }

    /* ─── Page layout ─── */
    .page {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 0;
      /* full height minus nav */
      min-height: calc(100vh - var(--nav-h));
    }

    /* ─── Sidebar ─── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      /* sticky within page */
      position: sticky;
      top: var(--nav-h);
      height: calc(100vh - var(--nav-h));
      overflow: hidden;
    }
    .sidebar-top {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    .stat-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .stat-box:hover { border-color: var(--border-2); background: var(--surface-3); }
    .stat-box.active { border-color: var(--accent); background: var(--surface); }
    .stat-num { font-size: 20px; font-weight: 600; line-height: 1; margin-bottom: 3px; }
    .stat-num.g { color: var(--green); }
    .stat-num.r { color: var(--red); }
    .stat-lbl { font-size: 11px; color: var(--text-3); font-weight: 500; }
    .sidebar-header {
      padding: 12px 16px 8px;
      font-size: 11px; font-weight: 600; letter-spacing: .6px;
      text-transform: uppercase; color: var(--text-3);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-count {
      font-size: 11px; padding: 1px 6px; border-radius: 999px;
      background: var(--surface-3); color: var(--text-2); font-weight: 500;
    }
    .sidebar-list { flex: 1; overflow-y: auto; padding: 0 10px 16px; }
    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    /* ─── Client card ─── */
    .cli-card {
      position: relative; overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
      cursor: pointer;
      background: var(--surface);
      margin-bottom: 6px;
      transition: border-color .15s, box-shadow .15s;
    }
    .cli-card::after {
      content: '';
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--green);
    }
    .cli-card.off::after { background: var(--red); }
    .cli-card:hover { border-color: var(--border-2); box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .cli-card.sel { border-color: var(--green); background: var(--green-soft); }
    .cli-card.off.sel { border-color: var(--red); background: var(--red-soft); }
    .cli-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .cli-name { font-size: 13px; font-weight: 600; color: var(--text-1); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cli-addr { font-size: 11px; color: var(--text-3); font-family: var(--mono); overflow-wrap: anywhere; padding-left: 0; }
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 500; padding: 2px 7px;
      border-radius: 999px; flex-shrink: 0;
    }
    .pill.on  { background: var(--green-soft); color: var(--green-text); }
    .pill.off { background: var(--red-soft);   color: var(--red-text); }
    .pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .cli-del {
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .btn-del {
      font-family: var(--font); font-size: 11px; font-weight: 500;
      padding: 4px 9px; border-radius: 5px; cursor: pointer;
      border: 1px solid rgba(220,38,38,.2);
      background: var(--red-soft); color: var(--red-text);
      transition: background .15s;
    }
    .btn-del:hover { background: #fecaca; }
    .cli-empty {
      padding: 40px 12px; text-align: center; color: var(--text-3);
    }
    .cli-empty svg { width: 32px; height: 32px; opacity: .35; display: block; margin: 0 auto 10px; }
    .cli-empty p { font-size: 12px; }

    /* ─── Content area ─── */
    .content {
      padding: 20px;
      display: flex; flex-direction: column; gap: 16px;
    }

    /* ─── Panel ─── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
    .panel-badge {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: var(--surface-2); color: var(--text-3); border: 1px solid var(--border);
    }

    /* ─── Tasks ─── */
    .task-empty { padding: 40px 16px; text-align: center; font-size: 13px; color: var(--text-3); }
    .task-row {
      display: flex; align-items: flex-start;
      gap: 12px; padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .task-row:last-child { border-bottom: 0; }
    .task-row:hover { background: var(--surface-2); }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 13px; font-weight: 500; color: var(--text-1); margin-bottom: 6px; overflow-wrap: anywhere; }
    .task-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .task-id { font-size: 10px; font-family: var(--mono); color: var(--text-3); }
    .state-tag {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 999px;
      border: 0; cursor: pointer; font-family: var(--font);
    }
    .state-tag:hover { filter: brightness(.97); }
    .state-tag svg { width: 10px; height: 10px; flex-shrink: 0; }
    .s-pending  { background: var(--amber-soft); color: var(--amber-text); }
    .s-sent     { background: var(--blue-soft);  color: var(--blue-text);  }
    .s-received { background: var(--teal-soft);  color: var(--teal-text);  }
    .s-completed{ background: var(--green-soft); color: var(--green-text); }
    .s-failed   { background: var(--red-soft);   color: var(--red-text);   }
    .task-btns { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .btn-xs {
      font-family: var(--font); font-size: 11px; font-weight: 500;
      padding: 5px 9px; border-radius: 6px; cursor: pointer;
      border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text-2);
      transition: background .15s; white-space: nowrap;
    }
    .btn-xs:hover { background: var(--surface-3); color: var(--text-1); }
    .btn-xs.d { border-color: rgba(220,38,38,.2); background: var(--red-soft); color: var(--red-text); }
    .btn-xs.d:hover { background: #fecaca; }

    /* ─── Log Drawer ─── */
    .drawer-veil {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 300;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .drawer-veil.show { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 400;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      box-shadow: 0 -6px 32px rgba(0,0,0,.12);
      max-height: 65vh; display: flex; flex-direction: column;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .drawer.show { transform: translateY(0); }
    .drawer-pill {
      width: 36px; height: 4px; border-radius: 2px;
      background: var(--border-2); margin: 10px auto 0; flex-shrink: 0;
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .drawer-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
    .drawer-title svg { width: 14px; height: 14px; color: var(--text-3); }
    .drawer-x {
      width: 27px; height: 27px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface-2);
      display: grid; place-items: center; cursor: pointer; color: var(--text-2);
    }
    .drawer-x svg { width: 13px; height: 13px; }
    .drawer-body { flex: 1; overflow-y: auto; }
    .drawer-body::-webkit-scrollbar { width: 4px; }
    .drawer-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }
    .log-row {
      display: grid; grid-template-columns: 155px minmax(0, 1fr); gap: 10px;
      padding: 7px 16px; border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .log-row:last-child { border-bottom: 0; }
    .log-row:hover { background: var(--surface-2); }
    .log-t { font-size: 11px; font-family: var(--mono); color: var(--text-3); padding-top: 1px; }
    .log-m { font-size: 12px; color: var(--text-2); line-height: 1.5; overflow-wrap: anywhere; }
    .drawer-empty { padding: 40px 20px; text-align: center; color: var(--text-3); font-size: 13px; }

    /* ─── Send Modal ─── */
    .modal-veil {
      position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 500;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-veil.show { display: flex; }
    @media (min-width: 600px) { .modal-veil { align-items: center; padding: 20px; } }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 20px; width: 100%; max-width: 540px;
      animation: up .22s ease;
    }
    @media (min-width: 600px) { .modal-box { border-radius: var(--radius-lg); animation: sc .18s ease; } }
    @keyframes up { from { transform: translateY(24px); opacity: 0; } }
    @keyframes sc  { from { transform: scale(.96); opacity: 0; } }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
    }
    .modal-title { font-size: 15px; font-weight: 600; }
    .modal-x {
      width: 28px; height: 28px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--surface-2);
      display: grid; place-items: center; cursor: pointer; color: var(--text-2);
    }
    .modal-x svg { width: 14px; height: 14px; }
    .led-wrap {
      background: #000; border-radius: var(--radius); margin-bottom: 16px;
      height: clamp(68px, 13vw, 148px); overflow: hidden; position: relative;
      border: 1px solid rgba(255,255,255,.05);
    }
    .led-scan {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.12) 2px, rgba(0,0,0,.12) 4px);
    }
    .marquee {
      position: absolute; white-space: nowrap; z-index: 1;
      font-size: calc(clamp(68px,13vw,148px) * .58);
      font-weight: 700; top: 50%;
      margin-top: calc(clamp(68px,13vw,148px) * -.29);
      font-family: var(--mono); letter-spacing: 2px;
      animation: roll 8s linear infinite;
    }
    @keyframes roll { from { transform: translateX(var(--s, 100%)); } to { transform: translateX(var(--e, -100%)); } }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-g { margin-bottom: 13px; }
    .form-g:last-child { margin-bottom: 0; }
    .form-lbl { display: block; font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 5px; }
    .form-inp {
      width: 100%; padding: 8px 11px;
      border: 1px solid var(--border-2); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text-1);
      font-family: var(--font); font-size: 16px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    @media (min-width: 600px) { .form-inp { font-size: 13px; } }
    .form-inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(225,29,72,.1); }
    .form-textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.45;
    }
    .clr-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 10px; border: 1px solid var(--border-2);
      border-radius: var(--radius-sm); background: var(--surface-2);
    }
    .clr-row input[type=color] { width: 26px; height: 26px; border: 0; padding: 0; border-radius: 4px; cursor: pointer; background: transparent; }
    .clr-val { font-size: 12px; color: var(--text-2); font-family: var(--mono); }
    .modal-btns { display: flex; gap: 8px; margin-top: 18px; }
    .btn-send {
      flex: 1; padding: 10px; background: var(--accent); color: #fff;
      border: 0; border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-send svg { width: 13px; height: 13px; }
    .btn-send:hover { opacity: .9; }
    .btn-send:active { transform: scale(.98); }
    .btn-cancel {
      padding: 10px 16px; background: var(--surface-2); color: var(--text-2);
      border: 1px solid var(--border-2); border-radius: var(--radius-sm);
      font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background .15s;
    }
    .btn-cancel:hover { background: var(--surface-3); }
    .form-msg { min-height: 18px; margin-top: 10px; font-size: 12px; color: var(--text-3); }
    .form-msg.ok { color: var(--green-text); }
    .form-msg.err { color: var(--red-text); }
    .detail-box {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 12px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-2);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .detail-meta {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 8px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .detail-meta span:nth-child(odd) { color: var(--text-3); }
    .detail-meta span:nth-child(even) { color: var(--text-1); font-family: var(--mono); overflow-wrap: anywhere; }

    /* ─── Responsive ─── */
    @media (max-width: 820px) {
      .page { grid-template-columns: 1fr; }
      .sidebar {
        position: static; height: auto;
        border-right: 0; border-bottom: 1px solid var(--border);
      }
      .sidebar-list { max-height: 260px; padding-bottom: 10px; }
      .content { padding: 14px; }
      .log-row { grid-template-columns: 1fr; gap: 2px; }
      .form-row { grid-template-columns: 1fr; }
      .task-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="nav">
  <div class="nav-brand">
    <div class="nav-brand-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke="currentColor">
        <rect x="2" y="6" width="20" height="12" rx="3"/>
        <path d="M6 10v4M10 10v4M14 10v4M18 10v4"/>
      </svg>
    </div>
    <span class="nav-brand-name">LED Server</span>
  </div>
  <div class="nav-spacer"></div>
	  <div class="nav-right">
	    <div class="ws-chip">
	      <span class="ws-dot" id="wsDot"></span>
	      <span id="wsText">连接中</span>
	    </div>
	    <button class="nav-action" onclick="openLogs()" title="日志">
	      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
	        <path d="M9 12h6M9 16h6M9 8h6"/><rect x="3" y="3" width="18" height="18" rx="3"/>
	      </svg>
	      日志
	    </button>
	    <button class="icon-btn" onclick="toggleTheme()" title="切换主题">
      <svg id="themeIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
    <button class="icon-btn" onclick="openPasswordModal()" title="修改密码">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </button>
  </div>
</nav>

<!-- Page grid -->
<div class="page">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-stats">
        <div class="stat-box active" id="filterAll" onclick="setClientFilter('all')" title="显示所有客户端">
          <div class="stat-num" id="stTotal">0</div>
          <div class="stat-lbl">总数</div>
        </div>
        <div class="stat-box" id="filterOnline" onclick="setClientFilter('online')" title="仅显示在线客户端">
          <div class="stat-num g" id="stOnline">0</div>
          <div class="stat-lbl">在线</div>
        </div>
        <div class="stat-box" id="filterOffline" onclick="setClientFilter('offline')" title="仅显示离线客户端">
          <div class="stat-num r" id="stOffline">0</div>
          <div class="stat-lbl">离线</div>
        </div>
      </div>
    </div>
    <div class="sidebar-header">
      客户端
      <span class="sidebar-count" id="cliCount">0</span>
    </div>
    <div class="sidebar-list" id="clients">
      <div class="cli-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="6" width="20" height="12" rx="3"/>
          <path d="M6 10v4M10 10v4M14 10v4M18 10v4"/>
        </svg>
        <p>暂无客户端</p>
      </div>
    </div>
  </aside>

  <!-- Content -->
  <div class="content">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title" id="taskTitle">任务列表</span>
        <span class="panel-badge" id="taskBadge">0 条</span>
      </div>
      <div id="tasks">
        <div class="task-empty">← 选择左侧客户端查看任务</div>
      </div>
    </div>
  </div>
</div>

<!-- Log Drawer -->
<div class="drawer-veil" id="dVeil" onclick="closeLogs()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-pill"></div>
  <div class="drawer-head">
    <div class="drawer-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 12h6M9 16h6M9 8h6"/><rect x="3" y="3" width="18" height="18" rx="3"/>
      </svg>
      服务端日志
    </div>
    <button class="drawer-x" onclick="closeLogs()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody">
    <div class="drawer-empty">暂无日志</div>
  </div>
</div>

<!-- Send Modal -->
<div class="modal-veil" id="modal" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <span class="modal-title">发送消息</span>
      <button class="modal-x" onclick="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="led-wrap" id="preview">
      <div class="led-scan"></div>
      <div class="marquee" id="marquee">欢迎使用 LED Overlay</div>
    </div>
    <div class="form-g">
      <label class="form-lbl">显示内容</label>
      <textarea class="form-inp form-textarea" id="text" placeholder="输入滚动文字">欢迎使用 LED Overlay</textarea>
    </div>
    <div class="form-row">
      <div class="form-g">
        <label class="form-lbl">背景颜色</label>
        <div class="clr-row">
          <input type="color" id="bg" value="#000000">
          <span class="clr-val" id="bgV">#000000</span>
        </div>
      </div>
      <div class="form-g">
        <label class="form-lbl">字体颜色</label>
        <div class="clr-row">
          <input type="color" id="fg" value="#ff0000">
          <span class="clr-val" id="fgV">#ff0000</span>
        </div>
      </div>
      <div class="form-g">
        <label class="form-lbl">滚动速度 (px/s)</label>
        <input class="form-inp" id="speed" type="number" value="90" min="20">
      </div>
      <div class="form-g">
        <label class="form-lbl">循环次数</label>
        <input class="form-inp" id="loops" type="number" value="1" min="1">
      </div>
    </div>
    <div class="modal-btns">
      <button class="btn-send" onclick="sendTask()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        发送任务
      </button>
      <button class="btn-cancel" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<!-- Task Status Modal -->
<div class="modal-veil" id="statusModal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">任务状态详情</span>
      <button class="modal-x" onclick="closeStatusModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="detail-meta">
      <span>任务</span><span id="statusTaskId">-</span>
      <span>状态</span><span id="statusTaskState">-</span>
      <span>更新时间</span><span id="statusTaskTime">-</span>
    </div>
    <div class="detail-box" id="statusTaskDetail">暂无详情</div>
  </div>
</div>

<!-- Password Modal -->
<div class="modal-veil" id="pwdModal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">修改密码</span>
      <button class="modal-x" onclick="closePasswordModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="form-g">
      <label class="form-lbl">原密码</label>
      <input class="form-inp" id="oldPwd" type="password" autocomplete="current-password">
    </div>
    <div class="form-g">
      <label class="form-lbl">新密码</label>
      <input class="form-inp" id="newPwd" type="password" autocomplete="new-password">
    </div>
    <div class="form-g">
      <label class="form-lbl">再次输入新密码</label>
      <input class="form-inp" id="newPwd2" type="password" autocomplete="new-password">
    </div>
    <div class="modal-btns">
      <button class="btn-send" onclick="changePassword()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>
        提交
      </button>
      <button class="btn-cancel" onclick="closePasswordModal()">取消</button>
    </div>
    <div class="form-msg" id="pwdMsg"></div>
  </div>
</div>

<script>
  let ws, clients=[], logs=[], selected=null, clientFilter="all";
  let theme = localStorage.getItem("theme") || "auto";
  const $=id=>document.getElementById(id);

  function applyTheme(){
    if(theme==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",theme);
    $("themeIco").innerHTML = theme==="dark"
      ? "<path d='M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z'/>"
      : "<circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41'/>";
  }
  function toggleTheme(){
    theme = theme==="auto"?"dark":theme==="dark"?"light":"auto";
    localStorage.setItem("theme",theme); applyTheme();
  }

  function connect(){
    ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/admin");
    ws.onopen  = ()=>{ $("wsText").textContent="已连接";  $("wsDot").className="ws-dot on";  };
    ws.onclose = ()=>{ $("wsText").textContent="已断开";  $("wsDot").className="ws-dot off"; setTimeout(connect,1500); };
    ws.onmessage = e=>{
      const msg=JSON.parse(e.data);
      if(msg.type==="state"){ clients=msg.clients||[]; logs=msg.logs||[]; render(); }
    };
  }

  function render(){
    const total=clients.length, online=clients.filter(c=>c.online).length;
    $("stTotal").textContent=total; $("stOnline").textContent=online; $("stOffline").textContent=total-online;
    $("filterAll").classList.toggle("active",clientFilter==="all");
    $("filterOnline").classList.toggle("active",clientFilter==="online");
    $("filterOffline").classList.toggle("active",clientFilter==="offline");

    const shownClients=clients.filter(c=>clientFilter==="all" || (clientFilter==="online" ? c.online : !c.online));
    $("cliCount").textContent=shownClients.length;

    const box=$("clients");
    if(!shownClients.length){
      box.innerHTML='<div class="cli-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 10v4M10 10v4M14 10v4M18 10v4"/></svg><p>暂无客户端</p></div>';
    } else {
      box.innerHTML="";
      shownClients.forEach(c=>{
        const d=document.createElement("div");
        d.className="cli-card"+(c.online?"":" off")+(selected===c.id?" sel":"");
        const del=c.online?"":`<div class="cli-del"><button class="btn-del" onclick="delClient(event,${c.id})">删除客户端</button></div>`;
        d.innerHTML=`
          <div class="cli-row">
            <span class="cli-name">#${c.id} ${esc(c.name||c.addr)}</span>
            <span class="pill ${c.online?"on":"off"}"><span class="pill-dot"></span>${c.online?"在线":"离线"}</span>
          </div>
          <div class="cli-addr">${esc(c.addr)}</div>${del}`;
        d.onclick=()=>{ selected=c.id; openModal(); render(); };
        box.appendChild(d);
      });
    }
    renderTasks(); renderLogs();
  }

  function setClientFilter(filter){
    clientFilter=filter;
    render();
  }

  function renderTasks(){
    const c=clients.find(x=>x.id===selected), tasks=c?(c.tasks||[]):[];
    $("taskTitle").textContent=c?`客户端 #${c.id} · 任务列表`:"任务列表";
    $("taskBadge").textContent=tasks.length+" 条";
    if(!c){ $("tasks").innerHTML='<div class="task-empty">← 选择左侧客户端查看任务</div>'; return; }
    if(!tasks.length){ $("tasks").innerHTML='<div class="task-empty">该客户端暂无任务</div>'; return; }
    $("tasks").innerHTML=tasks.map(t=>`
      <div class="task-row">
        <div class="task-body">
          <div class="task-text">${esc(t.text)}</div>
          <div class="task-meta">${stag(t)}<span class="task-id">${esc(t.id)}</span></div>
        </div>
        <div class="task-btns">
          <button class="btn-xs" onclick="resend('${t.id}')">重新下发</button>
          <button class="btn-xs d" onclick="delTask('${t.id}')">删除</button>
        </div>
      </div>`).join("");
  }

  function renderLogs(){
    const el=$("drawerBody"), items=logs.slice(-200);
    if(!items.length){ el.innerHTML='<div class="drawer-empty">暂无日志</div>'; return; }
    el.innerHTML=items.map(l=>`
      <div class="log-row">
        <span class="log-t">${esc(l.time)}</span>
        <span class="log-m">${esc(l.text)}</span>
      </div>`).join("");
    el.scrollTop=el.scrollHeight;
  }

  function openLogs(){ $("dVeil").classList.add("show"); $("drawer").classList.add("show"); renderLogs(); setTimeout(()=>$("drawerBody").scrollTop=$("drawerBody").scrollHeight,50); }
  function closeLogs(){ $("dVeil").classList.remove("show"); $("drawer").classList.remove("show"); }
  function openModal(){ syncPreview(); $("modal").classList.add("show"); }
  function closeModal(){ $("modal").classList.remove("show"); }
  function openPasswordModal(){
    ["oldPwd","newPwd","newPwd2"].forEach(id=>$(id).value="");
    setPasswordMessage("");
    $("pwdModal").classList.add("show");
    setTimeout(()=>$("oldPwd").focus(),50);
  }
  function closePasswordModal(){ $("pwdModal").classList.remove("show"); }
  function openStatusModal(taskId){
    const c=clients.find(x=>x.id===selected);
    const t=c && (c.tasks||[]).find(x=>x.id===taskId);
    if(!t) return;
    $("statusTaskId").textContent=t.id||"-";
    $("statusTaskState").textContent=statusInfo(t.status)[1];
    $("statusTaskTime").textContent=t.updatedAt ? new Date(t.updatedAt*1000).toLocaleString() : "-";
    $("statusTaskDetail").textContent=t.detail || defaultStatusDetail(t.status);
    $("statusModal").classList.add("show");
  }
  function closeStatusModal(){ $("statusModal").classList.remove("show"); }
  function setPasswordMessage(text, cls){
    const el=$("pwdMsg");
    el.textContent=text||"";
    el.className="form-msg"+(cls?" "+cls:"");
  }
  async function changePassword(){
    const oldPassword=$("oldPwd").value, newPassword=$("newPwd").value, confirmPassword=$("newPwd2").value;
    if(!oldPassword || !newPassword || !confirmPassword){ setPasswordMessage("请完整填写三个密码框","err"); return; }
    if(newPassword!==confirmPassword){ setPasswordMessage("两次输入的新密码不一致","err"); return; }
    const body=new URLSearchParams({old_password:oldPassword,new_password:newPassword,confirm_password:confirmPassword});
    try{
      const r=await fetch("/change-password",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
      const data=await r.json();
      if(!r.ok || !data.ok){ setPasswordMessage(data.error||"修改失败","err"); return; }
      setPasswordMessage("密码已修改","ok");
      setTimeout(closePasswordModal,700);
    }catch(e){
      setPasswordMessage("网络错误，请稍后重试","err");
    }
  }

  function syncPreview(){
    $("preview").style.background=$("bg").value;
    $("marquee").style.color=$("fg").value;
    $("marquee").textContent=$("text").value||" ";
    $("bgV").textContent=$("bg").value; $("fgV").textContent=$("fg").value;
    requestAnimationFrame(()=>{
      const pw=$("preview").clientWidth, tw=$("marquee").scrollWidth;
      const sp=Math.max(20,Number($("speed").value||90));
      $("marquee").style.setProperty("--s",pw+"px");
      $("marquee").style.setProperty("--e",-tw+"px");
      $("marquee").style.animationDuration=Math.max(1,(pw+tw)/sp)+"s";
    });
  }
  ["text","bg","fg","speed"].forEach(id=>$(id).oninput=syncPreview);
  window.addEventListener("resize",syncPreview);

  function sendTask(){ ws.send(JSON.stringify({type:"send",clientId:selected,text:$("text").value,background:$("bg").value,foreground:$("fg").value,speed:Number($("speed").value),loops:Number($("loops").value)})); closeModal(); }
  function resend(id){ ws.send(JSON.stringify({type:"resend",clientId:selected,taskId:id})); }
  function delTask(id){ ws.send(JSON.stringify({type:"delete",clientId:selected,taskId:id})); }
  function delClient(e,id){ e.stopPropagation(); ws.send(JSON.stringify({type:"deleteClient",clientId:id})); if(selected===id)selected=null; }

  function statusInfo(s){
    const m={
      pending:  ["s-pending","待发送","<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3 2'/></svg>"],
      sent:     ["s-sent","待接收","<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M5 12h14'/><path d='m13 6 6 6-6 6'/></svg>"],
      received: ["s-received","待显示","<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z'/><circle cx='12' cy='12' r='3'/></svg>"],
      displaying:["s-sent","待显示","<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><rect x='3' y='5' width='18' height='14' rx='2'/><path d='M8 12h8'/></svg>"],
      completed:["s-completed","已完成","<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M20 6 9 17l-5-5'/></svg>"],
      failed:   ["s-failed","失败","<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><circle cx='12' cy='12' r='9'/><path d='m15 9-6 6M9 9l6 6'/></svg>"]
    };
    return m[s]||["","未知",""];
  }
  function defaultStatusDetail(s){
    const m={
      pending:"任务正在等待下发或客户端接收确认。",
      sent:"服务端已下发任务，正在等待客户端确认收到。",
      received:"客户端已收到任务，正在准备悬浮窗显示。",
      displaying:"客户端已加入本地显示队列，正在按顺序显示。",
      completed:"客户端已完成显示。",
      failed:"任务失败，但客户端没有返回更具体的错误信息。"
    };
    return m[s]||"暂无详情";
  }
  function stag(t){
    const i=statusInfo(t.status);
    return `<button class="state-tag ${i[0]}" onclick="openStatusModal('${escAttr(t.id)}')">${i[2]}<span>${i[1]}</span></button>`;
  }
  function esc(v){ return String(v||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
  function escAttr(v){ return String(v||"").replace(/['\\]/g,c=>"\\"+c).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  applyTheme(); connect();
</script>
</body>
</html>
